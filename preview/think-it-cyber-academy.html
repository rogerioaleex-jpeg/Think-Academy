<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cyber Labs - Think IT</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        body {
            background-color: #F7F8F8; /* Light Mode Background */
            color: #191c22;
        }
        /* Custom scrollbar for data-dense feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F8F8; 
        }
        ::-webkit-scrollbar-thumb {
            background: #bec9c7; 
            border-radius: 4px;

            background: #6f7978;

<style>/* Identidade Think IT (extraída do Book Executivo): tema claro, teal + lime */
  /* Cyber Intelligence Framework (Stitch) — Inter + JetBrains Mono, teal/lime */
  :root{
    --bg:#F7F8F8; --ink:#191c22; --teal:#277471; --teal-deep:#005b58; --teal2:#4D9996; --lime:#C8D541;
    --orange:#E88A3A; --red:#ba1a1a; --gray:#3f4948; --muted:#6f7978;
    --border:#E6E7E7; --card:#FFFFFF; --dark:#21242B;
    --teal-tint:#EFF6F5; --lime-tint:#F5F8E9;
    --shadow:0 1px 2px rgba(33,36,43,.04), 0 8px 24px rgba(33,36,43,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .mono,.kicker,.ck,.pill,.logo .t2,.htag{font-family:"JetBrains Mono",ui-monospace,monospace}
  .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;
    letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}

  /* Sidebar (ink escuro, como os cards de destaque do book) */
  .sidebar{width:244px;flex-shrink:0;background:var(--dark);color:#fff;
    padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;padding:2px 8px 0}
  .logo .mark{flex-shrink:0}
  .logo .t1{font-weight:800;font-size:20px;letter-spacing:.2px;line-height:1}
  .logo .t2{color:var(--lime);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
  .nav{display:flex;flex-direction:column;gap:1px;margin-top:18px;flex:1;overflow:auto}
  .navsec{font-size:10px;letter-spacing:1.6px;color:#6b727a;text-transform:uppercase;padding:14px 12px 5px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;
    color:#c7ccd2;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;text-align:left;
    border-left:3px solid transparent}
  .nav button:hover{background:#2b2f37;color:#fff}
  .nav button.active{background:#2b2f37;color:#fff;border-left-color:var(--lime)}
  .nav .ic{width:22px;text-align:center;font-size:20px}
  .foot{color:#6b727a;font-size:11px;padding:10px 12px 0;border-top:1px solid #2b2f37;margin-top:8px}
  .logout{margin-top:6px;color:#c7ccd2;font-size:14px;padding:9px 12px;background:none;border:none;text-align:left;cursor:pointer;border-radius:8px}
  .logout:hover{background:#2b2f37;color:#fff}

  /* Topbar */
  .content{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:16px;background:#fff;
    border-bottom:1px solid var(--border);padding:12px 26px;position:sticky;top:0;z-index:5}
  .search{flex:1;max-width:460px}
  .search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:9px 13px;color:var(--ink);font-size:14px;outline:none}
  .search input:focus{border-color:var(--teal)}
  .search input::placeholder{color:var(--muted)}
  .bell{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:8px 11px;cursor:pointer;font-size:15px}
  .bell .badge{position:absolute;top:-6px;right:-6px;background:var(--teal);color:#fff;
    font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:flex;
    align-items:center;justify-content:center;padding:0 4px}
  main{padding:30px 34px;max-width:1160px;width:100%;margin:0 auto}

  /* Cabeçalho de seção (assinatura do book) */
  .head{display:flex;gap:14px;margin-bottom:22px}
  .head .accent{width:6px;border-radius:3px;background:linear-gradient(var(--lime) 0 50%,var(--teal) 50% 100%);flex-shrink:0}
  .kicker{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:4px}
  h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.3px}
  .head .sub{color:var(--gray);font-size:14px;margin-top:6px}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
  .card.top{border-top:4px solid var(--teal)}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
  h2{font-size:15px;margin:0 0 14px;font-weight:700}
  .ck{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:0 0 12px}

  /* KPI (cartão com borda superior colorida) */
  .kpi{background:var(--card);border:1px solid var(--border);border-top-width:4px;border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .l{font-size:13px;font-weight:700;color:var(--ink)}
  .kpi .v{font-size:30px;font-weight:800;margin:8px 0 6px}
  .kpi .u{width:40px;height:2px;border-radius:2px;margin-bottom:8px}
  .kpi .h{color:var(--muted);font-size:11px}

  .pill{display:inline-block;background:var(--teal-tint);border:1px solid #d6e8e6;
    color:var(--teal);border-radius:999px;font-size:11px;font-weight:600;padding:2px 10px}
  .tag{color:var(--muted);font-size:12px}
  .track{height:8px;background:#eceeee;border-radius:999px;overflow:hidden}
  .bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--lime))}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{background:#1f605d}
  .btn.ghost{background:#eef1f1;color:var(--gray)}
  .btn.danger{background:#f6e3e3;color:var(--red)}
  .muted{color:var(--muted)} .row{display:flex;align-items:center;justify-content:space-between}
  .clickable{cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .clickable:hover{border-color:var(--teal);box-shadow:0 6px 22px rgba(39,116,113,.12)}
  .view{display:none}.view.active{display:block}
  .backlink{color:var(--teal);font-size:13px;cursor:pointer;display:inline-block;margin-bottom:14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  .banner{background:var(--teal-tint);border:1px solid #d6e8e6;border-radius:10px;padding:10px 14px;color:var(--teal);font-size:12px;margin-bottom:16px}
  .sw{width:40px;height:23px;border-radius:999px;position:relative;display:inline-block;cursor:pointer;flex-shrink:0}
  .sw::after{content:"";position:absolute;top:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on{background:var(--teal)}.sw.on::after{left:19px}
  .sw.off{background:#cfd4d4}.sw.off::after{left:2.5px}
  .delta{font-family:"JetBrains Mono";font-size:11px;font-weight:500;border-radius:6px;padding:2px 7px}
  .delta.up{background:var(--lime-tint);color:#5c6300}.delta.down{background:#fdecea;color:var(--red)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 0 0 rgba(186,26,26,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(186,26,26,.6)}70%{box-shadow:0 0 0 8px rgba(186,26,26,0)}100%{box-shadow:0 0 0 0 rgba(186,26,26,0)}}

  /* Card escuro de destaques (igual ao book) */
  .dark{background:var(--dark);color:#fff;border-radius:12px;padding:20px}
  .dark .ck{color:var(--lime)}
  .hl{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
  .hl:last-child{margin-bottom:0}
  .htag{flex-shrink:0;width:96px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.6px;
    color:#fff;border-radius:6px;padding:7px 0;text-transform:uppercase}
  .hl p{margin:0;font-size:12.5px;color:#c7ccd2;line-height:1.5}

function icon(n){return `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em">${ICONS[n]||ICONS.dashboard}</svg>`;}

function header(kicker,title,sub){
  return `<div class="head"><div class="accent"></div><div>
    <div class="kicker">${kicker}</div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`;
}
function kpi(color,l,v,h){
  return `<div class="kpi" style="border-top-color:${color}"><div class="l">${l}</div>
    <div class="v" style="color:${color}">${v}</div><div class="u" style="background:${color}"></div>
    ${h?`<div class="h">${h}</div>`:''}</div>`;
}
function compRow(c,big){return `<div style="margin-bottom:11px"><div class="row" style="font-size:${big?'14px':'13px'};margin-bottom:5px">
  <span>${c.name}</span><span class="muted">${c.pct}%</span></div><div class="track"><div class="bar" style="width:${c.pct}%"></div></div></div>`;}

/* radar SVG (teal sobre claro) */
function radar(comps){
  const cx=160,cy=150,R=110,n=comps.length;
  const pt=(i,r)=>{const a=(-90+i*360/n)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let rings='';[0.25,0.5,0.75,1].forEach(f=>{rings+=`<polygon points="${comps.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#E1E5E5"/>`;});
  let axes='',labels='';comps.forEach((c,i)=>{const [x,y]=pt(i,R);axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E1E5E5"/>`;
    const [lx,ly]=pt(i,R+18);labels+=`<text x="${lx}" y="${ly}" fill="#5A6066" font-size="10" text-anchor="middle" dominant-baseline="middle">${c.name}</text>`;});
  const poly=comps.map((c,i)=>pt(i,R*c.pct/100).join(',')).join(' ');
  const dots=comps.map((c,i)=>{const [x,y]=pt(i,R*c.pct/100);return `<circle cx="${x}" cy="${y}" r="3" fill="#277471"/>`;}).join('');
  return `<svg viewBox="0 0 320 300" width="100%" style="max-width:340px">${rings}${axes}
    <polygon points="${poly}" fill="rgba(39,116,113,.16)" stroke="#277471" stroke-width="2"/>${dots}${labels}</svg>`;
}
function fakeQR(){let g=[],s=7;for(let i=0;i<21*21;i++){s=(s*1103515245+12345)&0x7fffffff;g.push((s>>16)%2);}
  const fnd=(r,c)=>((r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7));let cells='';
  for(let r=0;r<21;r++)for(let c=0;c<21;c++){let on=fnd(r,c)?((r%6===0||c%6===0)||(r>1&&r<5&&c>1&&c<5)):g[r*21+c];
    cells+=`<rect x="${c*6}" y="${r*6}" width="6" height="6" fill="${on?'#21242B':'#fff'}"/>`;}
  return `<svg viewBox="0 0 126 126" width="140" height="140" style="background:#fff;border:1px solid #E6E7E7;border-radius:8px;padding:6px">${cells}</svg>`;}

const ROI_BUDGET=[['SOC Operations',85,'$120k / $140k','ok'],['Threat Intel',92,'$85k / $92k','lime'],['Incident Response',105,'$110k / $105k','over'],['Red Team',60,'$45k / $75k','ok']];
V.roi=()=>{
  const maxv=40,W=520,H=210,pad=26,bw=44,gap=(W-pad*2)/ROI_TREND.length;
  let bars='',line='';const pts=[];
  ROI_TREND.forEach((m,i)=>{const x=pad+i*gap+gap/2;const sh=(m[1]/maxv)*(H-40),vh=(m[2]/maxv)*(H-40);
    const yb=H-20-sh; bars+=`<rect x="${x-bw/2}" y="${yb}" width="${bw}" height="${sh}" fill="#4D9996" rx="4"/>`;
    bars+=`<rect x="${x-bw/2}" y="${yb-vh}" width="${bw}" height="${vh}" fill="#C8D541" rx="4"/>`;
    bars+=`<text x="${x}" y="${H-4}" text-anchor="middle" font-size="10" fill="#6f7978" font-family="JetBrains Mono">${m[0]}</text>`;
    pts.push([x,H-20-((m[1]+m[2])/2/maxv)*(H-40)*1.4]);});
  line=`<polyline fill="none" stroke="#005b58" stroke-width="2.5" stroke-dasharray="5 4" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  return `
  <div class="row" style="align-items:flex-start">
    ${header('Executivo · RH & Custos','Training ROI & Cost Dashboard','Visão estratégica de investimento em treinamento vs. ganho de performance por área técnica.')}

      <button class="btn"><span style="font-size:17px;margin-right:6px;display:inline-flex">${icon('download')}</span>Exportar relatório</button></div>
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    ${roiKpi('payments','Custo por skill adquirido','$1.245','vs. $1.421 no trimestre','down','-12,4%')}
    ${roiKpi('savings','Economia em contratação','$485K','via upskilling interno','up','+8,2%','var(--lime)')}
    ${roiKpi('trending_up','Melhoria de retenção','94,2%','entre operadores treinados','up','+4,1%')}
    ${roiKpi('track_changes','ROI geral de treinamento','312%','retorno projetado 12 meses','flat','On Track')}
  </div>
  <div class="grid" style="grid-template-columns:1.5fr 1fr">
    <div class="card top"><div class="row"><div class="ck" style="margin:0">ROI & Investment Trends</div>
      <div style="display:flex;gap:14px;font-size:11px" class="mono"><span style="color:#4D9996">● Spend</span><span style="color:#8a9a1f">● Value Gen.</span></div></div>
      <p class="tag" style="margin:4px 0 10px">Retorno acumulado vs. gasto acumulado (YTD)</p>
      <svg viewBox="0 0 ${W} ${H}" width="100%">${bars}${line}</svg>
    </div>
    <div class="card"><div class="ck">Budget Utilization</div><p class="tag" style="margin:0 0 14px">Alocação Q3 vs. gasto real</p>
      ${ROI_BUDGET.map(b=>`<div style="margin-bottom:14px"><div class="row" style="font-size:13px;margin-bottom:5px"><b>${b[0]}</b><span class="mono" style="font-size:11px;color:${b[3]==='over'?'var(--red)':'var(--muted)'}">${b[1]}% · ${b[2]}</span></div>
        <div class="track"><div style="height:100%;border-radius:999px;width:${Math.min(100,b[1])}%;background:${b[3]==='over'?'var(--red)':b[3]==='lime'?'var(--lime)':'var(--teal)'}"></div></div></div>`).join('')}
    </div>
  </div>`;
};
function roiKpi(ic,label,val,hint,dir,delta,valColor){
  const d=dir==='down'?'delta down':dir==='up'?'delta up':'pill';
  return `<div class="kpi" style="border-top-color:var(--teal)"><div class="row" style="align-items:flex-start">
    <span style="font-size:22px;color:var(--teal);background:var(--teal-tint);border-radius:8px;padding:6px;display:inline-flex">${icon(ic)}</span>
    <span class="${d}">${delta}</span></div>
    <div class="l mono" style="margin-top:12px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--gray)">${label}</div>
    <div class="v" style="color:${valColor||'var(--ink)'};font-size:28px;margin:6px 0 4px">${val}</div>
    <div class="h">${hint}</div></div>`;
}
