name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tica
          POSTGRES_PASSWORD: tica
          POSTGRES_DB: tica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tica"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tica:tica@localhost:5432/tica_test?schema=public
      # Segredo forte só para o CI (>= 32 chars) — nunca use em produção.
      JWT_SECRET: ci-only-secret-com-mais-de-32-caracteres-1234567890
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @tica/database prisma generate

      - name: Prisma migrate (schema no banco de teste)
        run: pnpm --filter @tica/database prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Falha o job em vulnerabilidades de severidade alta ou superior.
      - name: Audit de dependências
        run: pnpm audit --audit-level high
