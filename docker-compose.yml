# ============================================================================
# Think IT Cyber Academy — ambiente de desenvolvimento
# Sobe: PostgreSQL, Redis, MinIO (object storage S3-compatível), API e Web.
#
# IMPORTANTE (segurança dos labs): a orquestração de laboratórios NÃO faz parte
# deste compose de aplicação. Os ambientes de lab devem rodar em uma rede
# Docker ISOLADA e separada (tica-labs-isolated), sem rota para a rede
# corporativa. Ver docs/01-architecture.md, seção "Isolamento de Labs".
# ============================================================================
version: "3.9"

networks:
  tica-app:
    driver: bridge
  # Rede isolada dos labs — internal:true impede saída para a internet/rede corp.
  tica-labs-isolated:
    driver: bridge
    internal: true

volumes:
  pgdata:
  miniodata:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tica
      POSTGRES_PASSWORD: tica
      POSTGRES_DB: tica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [tica-app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tica"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [tica-app]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks: [tica-app]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://tica:tica@postgres:5432/tica?schema=public"
      REDIS_URL: "redis://redis:6379"
      STORAGE_ENDPOINT: "http://minio:9000"
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tica-app]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3333"
    ports:
      - "3000:3000"
    depends_on: [api]
    networks: [tica-app]
