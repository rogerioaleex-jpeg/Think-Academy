# ============================================================================
# Think IT Cyber Academy — "lab plane" (host dedicado de VMs completas)
#
# Roda APENAS no servidor dedicado com KVM, fora do Render (que hospeda
# apenas apps/api e apps/web e não suporta virtualização/containers
# privilegiados). NÃO faz parte do docker-compose.yml da aplicação principal.
#
# Este compose só cria a infraestrutura ESTÁTICA do lab plane:
#   - a rede isolada `tica-labs-isolated` (internal:true — sem rota de saída
#     para a internet/rede corporativa, ver docs/01-architecture.md), onde
#     as VMs (Windows/Ubuntu) vivem;
#   - a rede `tica-labs-edge` (com internet), só para o Traefik emitir
#     certificados e aceitar tráfego externo — as VMs nunca entram nela;
#   - o Traefik (reverse proxy) — modo `traefik-labels`, PADRÃO e único modo
#     que realmente funciona com a rede isolada: validado na prática que
#     redes Docker `internal:true` não publicam portas (`docker port` nunca
#     resolve nada), então sem o Traefik nenhuma VM tem accessUrl de
#     verdade. Ele expõe cada VM em https://lab-<instanceId>.<LAB_PUBLIC_DOMAIN>/
#     com TLS automático — também resolve o mixed content, já que `apps/web`
#     roda em HTTPS e um iframe `http://` seria bloqueado. Usa um
#     certificado WILDCARD único (`*.<LAB_PUBLIC_DOMAIN>`), obtido uma vez na
#     inicialização — validado em produção: emitir um certificado NOVO por
#     instância (via label `tls.certresolver`) levava ~50s por lab (parecia
#     "não abre nenhuma VM") e arriscaria o limite semanal de emissões do
#     Let's Encrypt com uso real. Com o wildcard estático, todo `accessUrl`
#     já está coberto assim que o container sobe.
#
# Os containers de cada VM (Windows/Ubuntu) são criados e destruídos
# DINAMICAMENTE pelo VmLabDriver (apps/api/src/labs/drivers/vm.driver.ts) via
# `docker run`/`docker rm` — eles não aparecem aqui.
#
# Pré-requisitos deste host — ver README.md e check-host.sh:
#   - Docker instalado e com `dockerd` escutando em TCP com TLS mútuo
#     (DOCKER_HOST=tcp://<host>:2376, DOCKER_TLS_VERIFY=1), consumido pela
#     API (que roda no Render) via variáveis de ambiente padrão do Docker CLI.
#   - /dev/kvm acessível (virtualização de hardware habilitada) — obrigatório
#     para labs Windows 10; Ubuntu Desktop funciona sem KVM.
# ============================================================================
version: "3.9"

# IMPORTANTE: as duas redes abaixo são `external: true` de propósito. Sem
# isso, `docker compose up` cria redes NOVAS prefixadas com o nome do projeto
# (ex.: `root_tica-labs-isolated`) em vez de reaproveitar as redes reais que
# o VmLabDriver usa (`LAB_NETWORK=tica-labs-isolated`) — validado em produção:
# o Traefik ficou isolado numa rede errada e nunca alcançava as VMs. Crie as
# redes reais uma vez, ANTES do primeiro `docker compose up` (o
# `VmLabDriver.ensureNetwork()` também cria `tica-labs-isolated` sozinho se
# ela não existir, mas `tica-labs-edge` precisa ser criada manualmente):
#   docker network create --internal tica-labs-isolated
#   docker network create tica-labs-edge
networks:
  tica-labs-isolated:
    external: true
  tica-labs-edge:
    external: true

volumes:
  traefik-certs:

services:
  # Necessário para LAB_VM_ACCESS_MODE=traefik-labels (padrão — ver comentário
  # no topo do arquivo). IMPORTANTE: mantenha a tag do Traefik razoavelmente
  # atual — validamos na prática que `traefik:v3.1` falha contra um Docker
  # Engine recente ("client version 1.24 is too old"), porque o client Docker
  # embutido no Traefik é fixado no build da imagem. `v3.7` foi validado
  # funcionando; se seu dockerd for muito mais novo/antigo que isso, teste
  # antes de fixar em produção.
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=tica-labs-isolated
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LAB_ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${LAB_ACME_DNS_PROVIDER:-}
      # Certificado wildcard único, obtido uma vez no boot do Traefik — cobre
      # QUALQUER lab-<id>.<LAB_PUBLIC_DOMAIN> automaticamente (ver comentário
      # no topo do arquivo). LAB_PUBLIC_DOMAIN aqui precisa ser o MESMO valor
      # configurado na API (Render) — ex.: "labs.hackerarena.com.br".
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=*.${LAB_PUBLIC_DOMAIN:-labs.example.com}
    # CF_DNS_API_TOKEN (provider=cloudflare) e LAB_PUBLIC_DOMAIN — NUNCA
    # versionar o valor real; vêm de um .env local no host (fora do git),
    # lido pelo `docker compose` a partir do mesmo diretório deste arquivo.
    # Ver README.md.
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    # Duas redes propositalmente: `tica-labs-edge` dá ao Traefik saída à
    # internet (obrigatória para emitir certificados e para :443 receber
    # tráfego externo); `tica-labs-isolated` é por onde ele alcança as VMs
    # como reverse-proxy target. As VMs em si continuam SEM rota de saída.
    networks: [tica-labs-edge, tica-labs-isolated]
